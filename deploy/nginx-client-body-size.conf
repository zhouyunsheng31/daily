# ============================================================================
# 2026-08-13 修复：文件上传全部 413（"只要上传文件就是失败"）
#
# 根因：nginx 未配置 client_max_body_size，使用默认值 1m —— 前端把文件转 base64
# （膨胀 ~4/3）放进 JSON body 后，任何原文件 >~750KB 的上传请求在 nginx 层即被
# 413 拒绝（错误页为 HTML，不是 Express JSON），根本到不了后端。
#
# 修复：在 server 块（http/server 任意层级均可）添加：
#   client_max_body_size 600m;
#
# 与后端 server/src/index.ts 的 express.json({ limit: '600mb' }) 对齐。
# 工作区配额（游客200MB / 登录512MB / 月卡10-100GB）仍是唯一业务闸门，
# 600MB body ≈ 450MB 原文件（base64 膨胀 4/3），覆盖常规上传场景。
#
# 部署步骤（SSH 到服务器执行）：
#   1) 在 /etc/nginx/sites-enabled/default（及 admin-daily）的 server 块内添加：
#        client_max_body_size 600m;
#   2) nginx -t && systemctl reload nginx（宝塔：nginx 面板重载）
#   3) 后端 index.ts 同步上传 + pm2 restart daily-server
# ============================================================================

# 建议放置位置（server 块内）：
# server {
#     client_max_body_size 600m;
#     ...
# }
