# ============================================================================
# Phase S15: shadowshub.xyz Nginx 反代配置
# ============================================================================
# 部署位置：宝塔面板 → 网站 → shadowshub.xyz → 设置 → 配置文件
#
# 重要：保留现有 server 块中的 location /（现有主页），仅追加以下 4 个 location 块。
# 这 4 个 location 块需要同时添加到 80 端口和 443 端口的 server 块中。
# ============================================================================

# 0. /daily 无尾斜杠 → 301 重定向到 /daily/
# 避免用户输入 shadowshub.xyz/daily 看到错误页面
location = /daily {
    return 301 /daily/;
}

# 1. Web 端 SPA（路径前缀 /daily/）
# 所有 /daily/* 请求反代到 server，由 Express 静态托管 + SPA fallback 处理
location /daily/ {
    proxy_pass http://127.0.0.1:3456;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2. REST API
# /api/* 反代到 server，由 Express 路由处理
location /api/ {
    proxy_pass http://127.0.0.1:3456;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2.1 webOS API（shell-web 使用域名根路径 /webos/api/*）
# 含 SSE 流式对话（/webos/api/chat/stream）与 AI 生成 App，需关闭缓冲保证实时输出
location /webos/ {
    proxy_pass http://127.0.0.1:3456;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 3. WebSocket（用 /daily/ws 避免与服务器现有 aihub /ws location 冲突）
# /daily/ws 反代到 server 的 /ws 端点（proxy_pass 带 /ws 重写路径）
location /daily/ws {
    proxy_pass http://127.0.0.1:3456/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 24 小时超时，防止长时间空闲被 Nginx 断开
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# ============================================================================
# 验证命令（部署后在服务器执行）：
#
# 1. 健康检查
#    curl https://shadowshub.xyz/api/health
#
# 2. 主页保留（必须返回现有主页内容，非 Living Dashboard）
#    curl https://shadowshub.xyz/
#
# 3. Web 端访问
#    curl -I https://shadowshub.xyz/daily/
#
# 4. /daily 无尾斜杠重定向
#    curl -I https://shadowshub.xyz/daily
#    应返回 301 Location: /daily/
#
# 5. Nginx 配置语法检查
#    nginx -t
# ============================================================================
