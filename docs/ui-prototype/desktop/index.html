<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Dashboard 桌面端高保真原型</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #F0F0F2;
    color: #1A1A1A;
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }

  /* ===== 反 AI slop: 无紫渐变背景、无 emoji 图标、无边框线（色块区分优先）===== */

  /* 思考折叠 */
  .thinking-collapsed {
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .thinking-collapsed:hover { background: rgba(0,0,0,0.04); }

  /* 工具调用流动条：浅蓝→浅紫渐变 CSS 动画（功能性指示器，非装饰背景） */
  .tool-flow-bar {
    height: 3px;
    border-radius: 9999px;
    background: linear-gradient(90deg, #87CEEB 0%, #B19CD9 50%, #87CEEB 100%);
    background-size: 200% 100%;
    animation: tool-flow-anim 2.5s linear infinite;
  }
  @keyframes tool-flow-anim {
    0% { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
  }

  /* 思考等级水平滑块（4 档） */
  .thinking-slider-track {
    position: relative;
    height: 4px;
    background: rgba(0,0,0,0.08);
    border-radius: 9999px;
    margin: 8px 0;
  }
  .thinking-slider-fill {
    position: absolute;
    height: 100%;
    background: #3B82F6;
    border-radius: 9999px;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .thinking-slider-thumb {
    position: absolute;
    top: 50%;
    width: 16px;
    height: 16px;
    background: #FFFFFF;
    border: 2px solid #3B82F6;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(59,130,246,0.3);
    transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .thinking-slider-thumb:hover {
    box-shadow: 0 2px 8px rgba(59,130,246,0.4);
    transform: translate(-50%, -50%) scale(1.15);
  }
  .thinking-slider-tick {
    position: absolute;
    top: 50%;
    width: 6px;
    height: 6px;
    background: rgba(0,0,0,0.15);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  /* 缺漏页面 CSS 已移除（红框占位符已替换为真实 UI） */
  /* 右下角 AddWidgetMenu FAB（48×48 圆形 + 加号，hover 旋转 90° 变蓝） */
  .add-widget-fab {
    position: absolute;
    right: 24px;
    bottom: 24px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #FFFFFF;
    color: #1A1A1A;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), background 0.2s, color 0.2s, box-shadow 0.2s;
    z-index: 50;
  }
  .add-widget-fab:hover {
    transform: rotate(90deg);
    background: #3B82F6;
    color: #FFFFFF;
    box-shadow: 0 6px 20px rgba(59,130,246,0.4);
  }

  /* 思考动画点 */
  @keyframes thinking-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-3px); opacity: 1; }
  }
  .thinking-dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    background: #6B7280;
    border-radius: 50%;
    animation: thinking-bounce 1.2s ease-in-out infinite;
  }

  /* 滚动条美化 */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }

  /* 设备框标签 */
  .frame-label {
    font-size: 12px;
    color: #6B7280;
    font-style: italic;
    margin-bottom: 6px;
    margin-left: 4px;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ============================================================================

    shield: <path d="M12 2 4 5v7c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5z"/>,

    check: <path d="M20 6 9 17l-5-5"/>,

    eyeOff: <path d="M10 6.1A10 10 0 0 1 12 6c6 0 10 6 10 6a14 14 0 0 1-2.3 3M6.1 6.1A14 14 0 0 0 2 12s4 7 10 7a10 10 0 0 0 4-.8M3 3l18 18"/>,
    trash: <><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></>,

    folder: <path d="M4 5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/>,
    keyboard: <><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></>,
    cloud: <path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.5 1.5A4 4 0 0 0 6 19z"/>,

    zap: <path d="M13 2 3 14h9l-1 8 10-12h-9z"/>,
    clock: <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></>,

// ============================================================================
// MacosWindow 设备框（inlined from huashu-design assets/macos_window.jsx）

const macosWindowStyles = {
  window: {
    display: 'inline-block',
    background: '#fff',
    borderRadius: 10,
    overflow: 'hidden',
    boxShadow: '0 30px 80px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.12)',
  },
  titleBar: {
    height: 38,
    background: 'linear-gradient(to bottom, #F0F0F0, #E0E0E0)',
    display: 'flex',
    alignItems: 'center',
    padding: '0 14px',
    position: 'relative',
    userSelect: 'none',
  },
  trafficLights: { display: 'flex', gap: 8, alignItems: 'center' },
  light: { width: 12, height: 12, borderRadius: '50%', border: '0.5px solid rgba(0,0,0,0.12)' },
  close: { background: '#FF5F57' },
  minimize: { background: '#FEBC2E' },
  maximize: { background: '#28C840' },
  title: {
    position: 'absolute', left: 0, right: 0, textAlign: 'center',
    fontSize: 13, color: '#333', fontWeight: 500, pointerEvents: 'none',
  },
  content: { position: 'relative', overflow: 'hidden' },
};

function MacosWindow({ title = '', width = 900, height = 600, children }) {
  return (
    <div style={macosWindowStyles.window}>
      <div style={macosWindowStyles.titleBar}>
        <div style={macosWindowStyles.trafficLights}>
          <div style={{ ...macosWindowStyles.light, ...macosWindowStyles.close }} />
          <div style={{ ...macosWindowStyles.light, ...macosWindowStyles.minimize }} />
          <div style={{ ...macosWindowStyles.light, ...macosWindowStyles.maximize }} />
        </div>
        {title && <div style={macosWindowStyles.title}>{title}</div>}
      </div>
      <div style={{ ...macosWindowStyles.content, width, height }}>{children}</div>
    </div>
  );
}

// ============================================================================
// BrowserWindow 设备框（inlined from huashu-design assets/browser_window.jsx）
// 改造：emoji 导航按钮 → 内联 SVG Icon（反 AI slop）
// ============================================================================
const browserWindowStyles = {
  window: { display: 'inline-block', background: '#fff', borderRadius: 10, overflow: 'hidden', boxShadow: '0 30px 80px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.12)' },

  urlBar: { flex: 1, background: '#f1f3f4', borderRadius: 9999, padding: '7px 14px', fontSize: 13, color: '#333', display: 'flex', alignItems: 'center', gap: 8 },
  lockIcon: { color: '#5f6368', display: 'inline-flex', alignItems: 'center' },
  content: { position: 'relative', overflow: 'auto', background: '#fff' },
};

function BrowserWindow({ title = 'New Tab', url = 'https://example.com', width = 1200, height = 800, showTrafficLights = true, children }) {
  return (
    <div style={browserWindowStyles.window}>
      <div style={browserWindowStyles.chrome}>
        <div style={browserWindowStyles.tabRow}>
          {showTrafficLights && (
            <div style={browserWindowStyles.trafficLights}>
              <div style={{ ...browserWindowStyles.light, ...browserWindowStyles.close }} />
              <div style={{ ...browserWindowStyles.light, ...browserWindowStyles.minimize }} />
              <div style={{ ...browserWindowStyles.light, ...browserWindowStyles.maximize }} />
            </div>
          )}
          <div style={browserWindowStyles.tab}>
            <div style={browserWindowStyles.favicon} />
            <span>{title}</span>
          </div>
        </div>
      </div>
      <div style={browserWindowStyles.navBar}>
        <div style={browserWindowStyles.navButtons}>
          <div style={browserWindowStyles.navButton}><Icon name="arrowLeft" size={16} /></div>
          <div style={{ ...browserWindowStyles.navButton, opacity: 0.4 }}><Icon name="arrowRight" size={16} /></div>
          <div style={browserWindowStyles.navButton}><Icon name="refresh" size={14} /></div>
        </div>
        <div style={browserWindowStyles.urlBar}>
          <span style={browserWindowStyles.lockIcon}><Icon name="lock" size={12} /></span>
          <span>{url}</span>
        </div>
      </div>
      <div style={{ ...browserWindowStyles.content, width, height }}>{children}</div>
    </div>
  );
}

// ============================================================================
// BrowserHome 组件（1:1 还原 BrowserHome.tsx）
// ============================================================================
const browserHomeStyles = {

function BrowserHome() {
  const [searchValue, setSearchValue] = useState('');
  const bookmarks = [
    { title: 'GitHub', color: '#24292F' },
    { title: 'Google', color: '#4285F4' },
    { title: 'YouTube', color: '#FF0000' },
    { title: 'Twitter', color: '#1DA1F2' },
    { title: 'Wikipedia', color: '#000000' },
    { title: 'Gmail', color: '#EA4335' },

  return (
    <div style={browserHomeStyles.container}>
      <div style={{ marginBottom: 32, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
        <div style={browserHomeStyles.logo}>LD</div>
        <span style={{ color: COLORS.textSecondary, fontSize: 13 }}>Living Dashboard</span>
      </div>
      <div style={browserHomeStyles.searchWrap}>
        <Icon name="search" size={18} style={{ position: 'absolute', left: 16, top: '50%', transform: 'translateY(-50%)', color: COLORS.textTertiary }} />

          <button style={{ display: 'inline-flex', alignItems: 'center', gap: 4, padding: '4px 10px', borderRadius: 9999, border: 'none', background: COLORS.bgElevated, color: COLORS.textSecondary, fontSize: 12, cursor: 'pointer' }}>
            <Icon name="plus" size={12} /> 添加
          </button>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(96px, 1fr))', gap: 12 }}>
          {bookmarks.map((b, i) => (
            <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, padding: '12px 8px', borderRadius: 12, cursor: 'pointer', position: 'relative' }}>
              <div style={{ ...browserHomeStyles.bookmarkCircle, color: b.color }}>
                <Icon name="globe" size={28} />
              </div>
              <span style={{ fontSize: 11, color: COLORS.textSecondary, textAlign: 'center' }}>{b.title}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{ width: '100%', maxWidth: 800 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 12 }}>
          <Icon name="bookmark" size={14} style={{ color: COLORS.textSecondary }} />
          <span style={{ fontSize: 13, fontWeight: 600, color: COLORS.textSecondary }}>书签</span>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>

// ============================================================================
function ThinkingSlider({ level, onChange }) {
  // 源码标签 1:1 还原：极简/低/中/高（thinkingLevel.ts LEVEL_LABELS）
  const levels = ['极简', '低', '中', '高'];
  const percent = (level / (levels.length - 1)) * 100;
  return (
    <div style={{ padding: '4px 8px' }}>
      <div className="thinking-slider-track">
        <div className="thinking-slider-fill" style={{ width: `${percent}%` }} />
        {levels.map((_, i) => (
          <div key={i} className="thinking-slider-tick" style={{ left: `${(i / (levels.length - 1)) * 100}%` }} />

        <div className="thinking-slider-thumb" style={{ left: `${percent}%` }} />
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: COLORS.textTertiary, marginTop: 4 }}>

        ))}
      </div>
    </div>
  );
}

// AskUserCard 组件（1:1 还原：紫色左色条 + 单选/多选）
// ============================================================================
function AskUserCardDemo() {
  const [multiSelected, setMultiSelected] = useState(new Set(['opt_a']));
  const options = [
    { value: 'opt_a', label: '选项 A：使用现有面板布局', description: '复用当前模板，快速生成' },
    { value: 'opt_b', label: '选项 B：创建新布局', description: '从空白开始，自定义排版' },
    { value: 'opt_c', label: '选项 C：导入 JSON 配置', description: '从已有 JSON 文件导入布局' },
  ];
  function toggle(v) {
    const next = new Set(multiSelected);
    if (next.has(v)) next.delete(v); else next.add(v);
    setMultiSelected(next);
  }
  return (
    <div style={{ padding: 16, display: 'flex', flexDirection: 'column', gap: 16, background: COLORS.bgCanvas, height: '100%', overflowY: 'auto' }}>
      {/* 单选 */}
      <div style={{ padding: 12, background: 'rgba(0,0,0,0.03)', borderLeft: '3px solid rgb(139, 92, 246)', borderRadius: 12, fontSize: 12, color: COLORS.textPrimary, display: 'flex', flexDirection: 'column', gap: 8 }}>
        <div style={{ fontWeight: 500, lineHeight: 1.5 }}>你想用哪种方式打开这个面板？</div>
        {options.slice(0, 2).map((o, idx) => {
          const isSelected = idx === 1;
          return (
            <button key={o.value} type="button" style={{ display: 'flex', alignItems: 'flex-start', gap: 6, padding: '6px 10px', background: isSelected ? 'rgba(0,0,0,0.08)' : 'transparent', border: `1px solid ${COLORS.borderSubtle}`, borderRadius: 8, fontSize: 12, color: COLORS.textPrimary, fontFamily: 'inherit', textAlign: 'left', width: '100%', cursor: 'pointer' }}>
              <span style={{ flexShrink: 0, width: 14, height: 14, marginTop: 1, borderRadius: '50%', border: isSelected ? 'none' : `1.5px solid ${COLORS.textTertiary}`, background: isSelected ? 'rgb(139, 92, 246)' : 'transparent', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: '#fff' }}>
                {isSelected && <Icon name="check" size={10} strokeWidth={3} />}
              </span>
              <span style={{ display: 'flex', flexDirection: 'column', gap: 2, flex: 1, minWidth: 0 }}>
                <span style={{ fontWeight: isSelected ? 500 : 400, lineHeight: 1.4 }}>{o.label}</span>
                <span style={{ fontSize: 10, color: COLORS.textTertiary, lineHeight: 1.4 }}>{o.description}</span>
              </span>
            </button>
          );
        })}
        <div style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 10, color: COLORS.textTertiary }}>
          <Icon name="check" size={10} style={{ color: 'rgb(139, 92, 246)' }} /> 已回答
        </div>
      </div>
      {/* 多选 */}
      <div style={{ padding: 12, background: 'rgba(0,0,0,0.03)', borderLeft: '3px solid rgb(139, 92, 246)', borderRadius: 12, fontSize: 12, color: COLORS.textPrimary, display: 'flex', flexDirection: 'column', gap: 8 }}>
        <div style={{ fontWeight: 500, lineHeight: 1.5 }}>请选择要启用的功能模块（可多选）</div>
        {options.map((o) => {
          const isSelected = multiSelected.has(o.value);
          return (
            <button key={o.value} type="button" onClick={() => toggle(o.value)} style={{ display: 'flex', alignItems: 'flex-start', gap: 6, padding: '6px 10px', background: isSelected ? 'rgba(0,0,0,0.08)' : 'transparent', border: `1px solid ${COLORS.borderSubtle}`, borderRadius: 8, fontSize: 12, color: COLORS.textPrimary, fontFamily: 'inherit', textAlign: 'left', width: '100%', cursor: 'pointer' }}>
              <span style={{ flexShrink: 0, width: 14, height: 14, marginTop: 1, borderRadius: 3, border: isSelected ? 'none' : `1.5px solid ${COLORS.textTertiary}`, background: isSelected ? 'rgb(139, 92, 246)' : 'transparent', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: '#fff' }}>
                {isSelected && <Icon name="check" size={10} strokeWidth={3} />}
              </span>
              <span style={{ display: 'flex', flexDirection: 'column', gap: 2, flex: 1, minWidth: 0 }}>
                <span style={{ fontWeight: isSelected ? 500 : 400, lineHeight: 1.4 }}>{o.label}</span>
                <span style={{ fontSize: 10, color: COLORS.textTertiary, lineHeight: 1.4 }}>{o.description}</span>
              </span>
            </button>
          );
        })}
        <button type="button" disabled={multiSelected.size === 0} style={{ alignSelf: 'flex-end', padding: '4px 12px', background: multiSelected.size > 0 ? 'rgb(139, 92, 246)' : 'rgba(0,0,0,0.05)', color: multiSelected.size > 0 ? '#fff' : COLORS.textTertiary, border: 'none', borderRadius: 9999, fontSize: 11, cursor: multiSelected.size > 0 ? 'pointer' : 'not-allowed', fontFamily: 'inherit' }}>
          确认 ({multiSelected.size})
        </button>
      </div>
    </div>
  );
}

    ]},
    { cat: 'AI 助手', items: [
      { type: 'ai-assistant', name: 'AI 助手', icon: 'bot', env: 'local' },
      { type: 'ai-quiz', name: 'AI 出题', icon: 'sparkles', env: 'local' },
    ]},
    { cat: '学习工具', items: [
      { type: 'latex-quiz', name: 'LaTeX 公式练习', icon: 'script', env: 'pure' },
      { type: 'sudoku', name: '数独', icon: 'grid', env: 'pure' },
      { type: 'pdf-viewer', name: 'PDF 阅读器', icon: 'folder', env: 'local' },
    ]},
    { cat: '媒体与阅读', items: [
      { type: 'webview', name: '网页嵌入', icon: 'globe', env: 'local' },
      { type: 'html-canvas', name: 'HTML 画布', icon: 'layout', env: 'pure' },
    ]},
  ];
  const filteredCats = search.trim()
    ? cats.map(c => Object.assign({}, c, { items: c.items.filter(it => it.name.toLowerCase().includes(search.trim().toLowerCase())) })).filter(c => c.items.length > 0)
    : cats;
  return (
    <div style={addWidgetMenuStyles.wrap}>
      <div style={addWidgetMenuStyles.ctxLabel}>CanvasHome · 右下角 AddWidgetMenu 展开态</div>
      <button style={addWidgetMenuStyles.fab} title="添加组件">
        <Icon name="plus" size={20} strokeWidth={2.5} />
      </button>
      <div style={addWidgetMenuStyles.menu}>
        <div style={addWidgetMenuStyles.searchBar}>
          <Icon name="search" size={12} style={{ color: COLORS.textTertiary }} />
          <input style={addWidgetMenuStyles.searchInput} placeholder="搜索组件…" value={search} onChange={e => setSearch(e.target.value)} />
        </div>
        <div style={addWidgetMenuStyles.scroll}>
          {filteredCats.map(c => (
            <div key={c.cat} style={addWidgetMenuStyles.catGroup}>
              <div style={addWidgetMenuStyles.catLabel}>{c.cat}</div>
              {c.items.map(it => (
                <button key={it.type} style={addWidgetMenuStyles.menuItem}>
                  <div style={addWidgetMenuStyles.menuIcon}><Icon name={it.icon} size={12} /></div>
                  <span style={addWidgetMenuStyles.menuText}>{it.name}</span>
                  {it.env === 'local' && <span style={Object.assign({}, addWidgetMenuStyles.envTag, { background: 'rgba(249,115,22,0.15)', color: COLORS.orange })}>仅桌面端</span>}
                  {it.env === 'pure' && <span style={Object.assign({}, addWidgetMenuStyles.envTag, { background: 'rgba(34,197,94,0.15)', color: COLORS.success })}>纯前端</span>}
                </button>
              ))}
            </div>
          ))}
          {filteredCats.length === 0 && (
            <div style={{ padding: 20, textAlign: 'center', color: COLORS.textTertiary, fontSize: 11 }}>未找到匹配的组件</div>
          )}
        </div>
      </div>
      <div style={addWidgetMenuStyles.ctxHint}>点击 FAB 展开/收起 · 搜索框 + 分类网格 + 环境标签</div>
    </div>
  );
}
