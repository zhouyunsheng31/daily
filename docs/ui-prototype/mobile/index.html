<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Dashboard 移动端高保真原型 v3</title>
  <!-- React 18.3.1 + Babel 7.29.0 pinned CDN -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #F5F5F7; }
    body {
      font-family: 'Roboto', -apple-system, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: #1D1D1F;
      -webkit-font-smoothing: antialiased;
    }
    #root { min-height: 100vh; padding: 48px 32px; }
    .gallery { display: flex; gap: 36px; flex-wrap: wrap; align-items: flex-start; }
    .frame-cell { display: flex; flex-direction: column; align-items: center; }
    .frame-label {
      font-size: 13px;
      color: #555;
      font-style: italic;
      margin-bottom: 10px;
      letter-spacing: 0.02em;
      text-align: center;
      max-width: 412px;
    }
    .page-title {
      font-size: 32px;
      font-weight: 600;
      color: #1D1D1F;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .page-subtitle {
      font-size: 14px;
      color: #86868B;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    /* ====== 关键 class：思维链自动收缩 ====== */
    .thinking-collapsed {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(0,0,0,0.04);
      border-radius: 10px;
      font-size: 11px;
      color: #86868B;
      font-style: italic;
      cursor: pointer;
      width: fit-content;
    }
    .thinking-collapsed .chevron {
      width: 0; height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #86868B;
      transition: transform 0.2s;
    }
    .thinking-collapsed.expanded .chevron { transform: rotate(180deg); }
    .thinking-detail {
      margin-top: 6px;
      padding: 8px 10px;
      background: rgba(0,0,0,0.03);
      border-radius: 10px;
      font-size: 11px;
      color: #888;
      font-style: italic;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* ====== 关键 class：工具调用渐变流动条 ====== */
    .tool-flow-bar {
      position: relative;
      width: 100%;
      height: 3px;
      border-radius: 2px;
      overflow: hidden;
      background: rgba(74,144,226,0.08);
    }
    .tool-flow-bar::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 40%; height: 100%;
      background: linear-gradient(90deg, rgba(120,180,255,0) 0%, rgba(120,180,255,0.9) 50%, rgba(160,130,255,0) 100%);
      animation: toolFlow 1.8s linear infinite;
    }
    @keyframes toolFlow {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    .tool-call-summary {
      margin-top: 6px;
      font-size: 11px;
      color: #86868B;
      font-weight: 500;
    }
    .tool-status {
      margin-top: 3px;
      font-size: 11px;
      color: #4A90E2;
      font-style: italic;
    }

    /* ====== 关键 class：底部工具栏自动收缩 ====== */
    .autoHideBar {
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .autoHideBar.hidden {
      transform: translateY(110%);
    }
    .autoHideBar .address-bar-peek {
      transition: opacity 0.2s, height 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .autoHideBar.hidden .address-bar-peek {
      opacity: 0;
      height: 0;
      overflow: hidden;
    }

    /* ====== 关键 class：白名单按钮 ====== */
    .whitelist-btn {
      background: transparent;
      border: none;
      color: #86868B;
      font-size: 11px;
      padding: 6px 10px;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: rgba(134,134,139,0.4);
      text-underline-offset: 2px;
    }
    .whitelist-btn:hover { color: #555; }

    /* ====== 关键 class：思考等级滑块 thumb ====== */
    .thinking-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(0,0,0,0.08);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .thinking-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #6650A4;
      border: 3px solid #fff;
      box-shadow: 0 1px 4px rgba(102,80,164,0.4);
      transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .thinking-slider::-webkit-slider-thumb:hover { transform: scale(1.15); }
    .thinking-slider::-webkit-slider-thumb:active { transform: scale(1.25); }
    .thinking-slider-thumb {
      /* marker class for verification — intentionally no rules to avoid breaking slider interaction */
    }
    .thinking-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #6650A4;
      border: 3px solid #fff;
      box-shadow: 0 1px 4px rgba(102,80,164,0.4);
      cursor: pointer;
    }
    .slider-ticks {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      padding: 0 2px;
    }
    .slider-tick {
      font-size: 10px;
      color: #86868B;
      transition: color 0.2s;
    }
    .slider-tick.active { color: #6650A4; font-weight: 600; }

    /* ====== 通用：消息气泡 ====== */
    .bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .bubble-user {
      background: rgba(0,0,0,0.05);
      color: #333;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .bubble-ai {
      background: rgba(0,0,0,0.03);
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    /* 修复3：floating-ai-ball 已删除；v4 改为底部栏左右滑动切换 AI 对话框（swipe-h-indicator） */

    /* hide scrollbar inside android frame content */
    .android-content::-webkit-scrollbar { width: 0; height: 0; }
    .android-content { scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // =================================================================
    // AndroidFrame —— 来自 huashu-design/assets/android_frame.jsx（1:1 inline）
    // =================================================================
    const androidFrameStyles = {
      wrapper: {
        display: 'inline-block',
        padding: 10,
        background: '#1a1a1a',
        borderRadius: 44,
        boxShadow: '0 0 0 2px #2a2a2a, 0 20px 60px rgba(0,0,0,0.3)',
        position: 'relative',
      },
      screen: {
        position: 'relative',
        borderRadius: 36,
        overflow: 'hidden',
        background: '#fff',
      },
      statusBar: {
        position: 'absolute',
        top: 0, left: 0, right: 0,
        height: 32,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        padding: '0 24px',
        fontSize: 14,
        fontWeight: 500,
        fontFamily: 'Roboto, -apple-system, sans-serif',
        zIndex: 20,
        pointerEvents: 'none',
      },
      punchHole: {
        position: 'absolute',
        top: 10,
        left: '50%',
        transform: 'translateX(-50%)',
        width: 14, height: 14,
        background: '#000',
        borderRadius: '50%',
        zIndex: 30,
      },
      statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
      batteryText: { fontSize: 11, fontWeight: 600, marginLeft: 2 },
      content: {
        position: 'absolute',
        top: 32, left: 0, right: 0, bottom: 24,
        overflow: 'auto',
      },
      navBar: {
        position: 'absolute',
        bottom: 0, left: 0, right: 0,
        height: 24,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        gap: 60,
        zIndex: 10,
      },
      navButton: {
        width: 36, height: 4,
        background: 'rgba(0,0,0,0.3)',
        borderRadius: 999,
      },
    };

    function AndroidFrame({ children, width = 412, height = 892, time = '9:41', battery = 85, darkMode = false, navStyle = 'gesture' }) {
      const textColor = darkMode ? '#fff' : '#1a1a1a';
      return (
        <div style={androidFrameStyles.wrapper}>
          <div style={{ ...androidFrameStyles.screen, width, height, background: darkMode ? '#000' : '#fff' }}>
            <div style={{ ...androidFrameStyles.statusBar, color: textColor }}>
              <span>{time}</span>
              <div style={androidFrameStyles.statusIcons}>
                <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor">
                  <rect x="0" y="6" width="2" height="4" rx="0.5" />
                  <rect x="4" y="4" width="2" height="6" rx="0.5" />
                  <rect x="8" y="2" width="2" height="8" rx="0.5" />
                  <rect x="12" y="0" width="2" height="10" rx="0.5" />
                </svg>
                <svg width="14" height="10" viewBox="0 0 14 10" fill="none">
                  <path d="M7 9a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
                  <path d="M3 6a5 5 0 018 0" stroke="currentColor" strokeWidth="1.2" />
                  <path d="M0.5 3.5a11 11 0 0113 0" stroke="currentColor" strokeWidth="1.2" opacity="0.6" />
                </svg>
                <div style={{ width: 22, height: 10, border: '1.5px solid currentColor', borderRadius: 2, padding: 1, position: 'relative' }}>
                  <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1 }} />
                </div>
                <span style={androidFrameStyles.batteryText}>{battery}%</span>
              </div>
            </div>
            <div style={androidFrameStyles.punchHole} />
            <div className="android-content" style={androidFrameStyles.content}>
              {children}
            </div>
            {navStyle === 'gesture' && (
              <div style={androidFrameStyles.navBar}>
                <div style={{ ...androidFrameStyles.navButton, width: 100, height: 4, background: darkMode ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.4)' }} />
              </div>
            )}
            {navStyle === 'buttons' && (
              <div style={androidFrameStyles.navBar}>
                <span style={{ color: textColor, fontSize: 20 }}>◁</span>
                <span style={{ color: textColor, fontSize: 16 }}>○</span>
                <span style={{ color: textColor, fontSize: 16 }}>□</span>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =================================================================
    // 视觉常量（1:1 还原 Color.kt / Theme.kt）
    // =================================================================
    const COLORS = {
      background: '#FFFFFF',
      primary: '#6650A4',
      primaryContainer: '#E8DEF8',
      onPrimaryContainer: '#322259',
      onSurface: '#1D1D1F',
      onSurfaceVariant: '#86868B',
      error: '#FF3B30',
      success: '#34C759',
      warning: '#FF9500',
      cardBg: 'rgba(0,0,0,0.03)',
      cardBgFocused: 'rgba(0,0,0,0.06)',
      searchBg: 'rgba(0,0,0,0.04)',
      userBubble: 'rgba(0,0,0,0.05)',
      aiBubble: 'rgba(0,0,0,0.03)',
      divider: 'rgba(0,0,0,0.06)',
      glassBg: 'rgba(255,255,255,0.85)',
      aiAccent: '#4A90E2',
      thinkingBg: 'rgba(0,0,0,0.02)',
    };

    // =================================================================
    // BottomBar —— 1:1 还原 BottomBar.kt（BROWSER / CANVAS 两模式）
    // =================================================================
    function BottomBar({ mode = 'BROWSER', canGoBack = false, canGoForward = false, onBack, onForward, onHome, onTabs, onMore, onZoomOut, onZoomIn, tabCount = 0 }) {
      const btnStyle = {
        background: 'none', border: 'none', padding: 8,
        cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
      };
      const iconColor = (active) => active ? COLORS.onSurface : 'rgba(29,29,31,0.38)';
      const iconBtn = (key, active, onClick, iconSvg, label) => (
        <button key={key} style={btnStyle} onClick={onClick} aria-label={label} disabled={active === false && (key === 'back' || key === 'forward')}>
          <span style={{ color: iconColor(active !== false), display: 'inline-flex' }}>{iconSvg}</span>
        </button>
      );

      // 简易 SVG 图标集
      const Ico = {
        back: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>,
        forward: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>,
        home: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1V9.5z"/></svg>,
        // 设计改进：BROWSER 模式 Home 按钮加转换小图标（双向箭头 ↹），暗示点击可切换到画布主页
        homeWithConvert: (
          <span style={{ position: 'relative', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', lineHeight: 0 }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1V9.5z"/></svg>
            <span style={{ position: 'absolute', bottom: -3, right: -6, background: '#fff', borderRadius: 6, padding: '0 1px', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 0 0 1px rgba(0,0,0,0.06)' }}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={COLORS.primary} strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 8h13"/>
                <path d="M13 5l3 3-3 3"/>
                <path d="M21 16H8"/>
                <path d="M11 13l-3 3 3 3"/>
              </svg>
            </span>
          </span>
        ),
        tab: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>,
        more: <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>,
        zoomOut: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.3-4.3"/></svg>,
        zoomIn: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-4.3-4.3"/></svg>,
      };

      return (
        <div style={{
          display: 'flex', flexDirection: 'column',
          background: COLORS.glassBg,
          backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)',
          borderTop: `1px solid ${COLORS.divider}`,
          position: 'relative',
        }}>
          {/* 设计改进：左右滑动指示（滑一下把底部栏整体替换为 AI 对话框） */}
          <div className="swipe-h-indicator" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '4px 0 2px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.30)" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              <div style={{ width: 36, height: 4, borderRadius: 2, background: 'rgba(0,0,0,0.18)' }} />
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.30)" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </div>
            <div style={{ fontSize: 9, color: COLORS.onSurfaceVariant, marginTop: 2 }}>左右滑动切换 AI</div>
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-evenly', alignItems: 'center', padding: '4px 8px' }}>
          {mode === 'BROWSER'
            ? [iconBtn('back', canGoBack, onBack, Ico.back, '后退'),
               iconBtn('forward', canGoForward, onForward, Ico.forward, '前进'),
               iconBtn('home', true, onHome, Ico.homeWithConvert, '主页 · 切换主页类型'),
               <div key="tabs" style={{ position: 'relative', paddingTop: 8 }}>
                 {iconBtn('tabs', true, onTabs, Ico.tab, '标签页')}
                 {tabCount > 0 && (
                   <span style={{ position: 'absolute', top: 0, right: 0, background: COLORS.primary, color: '#fff', fontSize: 9, fontWeight: 600, padding: '1px 5px', borderRadius: 7, minWidth: 14, textAlign: 'center' }}>{tabCount > 99 ? '99+' : tabCount}</span>
                 )}
               </div>,
               iconBtn('more', true, onMore, Ico.more, '更多')]
            : [iconBtn('zoomOut', true, onZoomOut, Ico.zoomOut, '缩小'),
               iconBtn('zoomIn', true, onZoomIn, Ico.zoomIn, '放大'),
               iconBtn('home', true, onHome, Ico.home, '主页'),
               iconBtn('tabs', true, onTabs, Ico.tab, '标签页'),
               iconBtn('more', true, onMore, Ico.more, '更多')]}

          </div>
        </div>
      );
    }

    // =================================================================
    // Screen 1: BrowserHome（浏览器主页）—— 1:1 还原 BrowserHomeScreen.kt
    // =================================================================
    function BrowserHomeScreen() {
      const [text, setText] = useState('');
      const shortcuts = [
        { id: 1, title: '百度', letter: 'B' },
        { id: 2, title: '知乎', letter: 'Z' },
        { id: 3, title: '微博', letter: 'W' },
        { id: 4, title: 'GitHub', letter: 'G' },
      ];
      return (
        <div style={{ width: '100%', height: '100%', background: COLORS.background, overflowY: 'auto', padding: '24px 0' }}>
          {/* LogoHeader —— 设计改进：去掉 "Living Dashboard" 文字标题 */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '12px 16px' }}>
            <div style={{ width: 56, height: 56, borderRadius: 14, background: 'linear-gradient(135deg, #7B68EE, #6650A4)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 700, fontSize: 22, letterSpacing: '-0.02em' }}>LD</div>
          </div>
          <div style={{ fontSize: 10, color: '#999', textAlign: 'center', fontStyle: 'italic' }}>设计改进：去掉冗余文字标题</div>
          <div style={{ height: 16 }} />
          {/* SearchBar pill */}
          <div style={{ padding: '0 16px' }}>
            <div style={{ display: 'flex', alignItems: 'center', background: COLORS.searchBg, borderRadius: 28, padding: '0 16px', height: 52 }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={COLORS.onSurfaceVariant} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input
                value={text}
                onChange={e => setText(e.target.value)}
                placeholder="搜索或输入网址"
                style={{ flex: 1, border: 'none', background: 'transparent', outline: 'none', fontSize: 15, padding: '0 12px', color: COLORS.onSurface, fontFamily: 'inherit' }}
              />
              <button style={{ background: 'none', border: 'none', padding: 4, cursor: 'pointer', display: 'flex', color: COLORS.primary }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
              </button>
            </div>
          </div>
          <div style={{ height: 24 }} />
          {/* QuickAccessGrid —— 设计改进：去掉 "常用网站" 文字标签，网格本身自明 */}
          <div style={{ padding: '0 16px' }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8, paddingTop: 8 }}>
              {shortcuts.map(s => (
                <div key={s.id} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '8px 0', cursor: 'pointer' }}>
                  <div style={{ width: 48, height: 48, borderRadius: '50%', background: COLORS.primaryContainer, display: 'flex', alignItems: 'center', justifyContent: 'center', color: COLORS.onPrimaryContainer, fontWeight: 700, fontSize: 18 }}>{s.letter}</div>
                  <div style={{ fontSize: 11, color: COLORS.onSurface, marginTop: 4, textAlign: 'center' }}>{s.title}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{ height: 80 }} />
        </div>
      );
    }

    // =================================================================
    // Screen 2: CanvasHome 收起态 —— 1:1 还原 CanvasHomeScreen.kt
    // =================================================================
    function CircleIcon() {
      return (
