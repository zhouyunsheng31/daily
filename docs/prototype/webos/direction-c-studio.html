  <style>
    :root {

    }
    *{box-sizing:border-box} html{background:#c9c6be} body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);line-break:strict;background:
      linear-gradient(rgba(16,18,15,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(16,18,15,.045) 1px,transparent 1px),#d8d5cd;background-size:24px 24px;overflow-x:auto}
    button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,[role=button]:focus-visible{outline:3px solid rgba(255,107,61,.55);outline-offset:3px}svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .board{width:max-content;min-width:100%;padding:34px 38px 50px}.board-head{width:1355px;display:grid;grid-template-columns:1.35fr .72fr;gap:64px;align-items:end;padding:0 2px 27px;margin-bottom:27px;border-bottom:2px solid var(--carbon)}
    .eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}.eyebrow::before{content:"C";width:22px;height:22px;display:grid;place-items:center;color:#fff;background:var(--orange);font:800 11px/1 var(--mono)}
    h1{margin:0;max-width:790px;font-size:clamp(40px,4.4vw,66px);line-height:.99;letter-spacing:-.055em;font-weight:720;text-wrap:balance}h1 em{font-style:normal;color:var(--orange)}
    .board-copy{margin:0 0 4px;max-width:450px;color:#555950;font-size:14px;line-height:1.72;text-wrap:pretty}.board-copy strong{color:var(--ink);font-weight:700}
    .phones{display:flex;gap:17px;align-items:flex-start}.unit{width:326px}.unit-label{height:42px;padding:0 4px;display:flex;justify-content:space-between;align-items:flex-start;color:#5d6259;font:500 12px/1.3 var(--mono)}.unit-label strong{color:var(--ink);font:700 13px/1.3 var(--sans)}.unit-label span:last-child{padding:3px 6px;color:#fff;background:var(--carbon);font-variant-numeric:tabular-nums}.phone-scale{position:relative;width:326px;height:684px}

    /* iPhone 15 Pro geometry transcribed from Huashu Design's ios_frame.jsx. */
    .ios-frame{display:inline-block;padding:12px;width:417px;height:876px;position:relative;transform:scale(.78);transform-origin:top left;border-radius:60px;background:#070806;box-shadow:0 0 0 2px #31342e,0 30px 72px rgba(31,31,27,.3)}
    .ios-screen{position:relative;width:393px;height:852px;overflow:hidden;border-radius:48px;background:var(--carbon);isolation:isolate}.status-bar{position:absolute;z-index:50;inset:0 0 auto;height:54px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:16px;font-weight:650;pointer-events:none}.dynamic-island{position:absolute;z-index:60;top:12px;left:50%;width:124px;height:36px;transform:translateX(-50%);border-radius:99px;background:#000;transition:.36s var(--ease)}.ios-frame.listening .dynamic-island{width:192px;box-shadow:0 0 0 1px rgba(255,107,61,.5),0 0 28px rgba(255,107,61,.22)}
    .status-icons{display:flex;align-items:center;gap:6px}.signal{height:12px;display:flex;align-items:flex-end;gap:2px}.signal i{display:block;width:3px;border-radius:1px;background:currentColor}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:9px}.signal i:nth-child(4){height:11px}.wifi{width:16px;height:12px}.battery{position:relative;width:26px;height:12px;padding:1px;border:1.5px solid currentColor;border-radius:3px;opacity:.88}.battery::before{content:"";display:block;width:77%;height:100%;border-radius:1px;background:currentColor}.battery::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:6px;border-radius:0 1px 1px 0;background:currentColor}
    .app-content{position:absolute;z-index:3;inset:54px 0 34px;overflow:hidden}.home-indicator{position:absolute;z-index:70;bottom:10px;left:50%;width:140px;height:5px;transform:translateX(-50%);border-radius:99px;background:rgba(255,255,255,.48)}
    .screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;color:var(--white);background:var(--carbon);animation:screen-in .28s var(--ease)}@keyframes screen-in{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
    .hairline{border-color:var(--line)}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.shell-top{height:50px;flex:none;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.shell-id{display:flex;align-items:center;gap:9px;font:700 11px/1 var(--mono);letter-spacing:.06em}.shell-id i{width:8px;height:8px;background:var(--orange)}.agent-state{margin-left:auto;display:flex;align-items:center;gap:6px;color:#bec3b8;font:500 9px/1 var(--mono)}.agent-state i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(169,228,95,.55)}.top-action{width:44px;height:44px;margin-left:7px;border:0;background:transparent;display:grid;place-items:center;color:#fff}

    /* Assistant home as a command surface and audit stream, not a chat transcript. */
    .assistant-scroll{flex:1;overflow:auto;padding:16px 16px 116px;scrollbar-width:none}.assistant-scroll::-webkit-scrollbar{display:none}.command-kicker{display:flex;justify-content:space-between;color:#a6aca1;font:600 9px/1 var(--mono);letter-spacing:.1em}.command-kicker b{color:var(--orange);font-weight:700}.command-hero{padding:18px 0 15px;border-bottom:1px solid var(--line)}.command-hero h2{margin:0;max-width:335px;font-size:33px;line-height:1.06;letter-spacing:-.05em;font-weight:690}.command-hero>p{margin:10px 0 0;max-width:330px;color:#aeb3a9;font-size:12px;line-height:1.58}.trace-row{display:flex;gap:6px;margin-top:15px;overflow:auto;scrollbar-width:none}.trace-row span{flex:none;padding:7px 8px;border:1px solid var(--line);color:#aab0a5;background:#171a16;font:500 9px/1 var(--mono)}.trace-row span:first-child{border-color:rgba(255,107,61,.55);color:#ffc0aa}
    .request{margin-top:14px;border-left:3px solid var(--orange);padding:10px 12px;background:#1c1f1a;color:#e9e9e2;font-size:12px;line-height:1.48}.agent-plan{margin-top:9px;padding:11px 12px;background:var(--paper);color:var(--ink)}.plan-head{display:flex;justify-content:space-between;font:700 9px/1 var(--mono);letter-spacing:.06em}.plan-head span:last-child{color:#687064}.plan-copy{margin:8px 0 10px;font-size:11px;line-height:1.52}.plan-action{width:100%;min-height:42px;border:0;color:#fff;background:var(--orange);font-size:11px;font-weight:700}
    .activity-head{display:flex;align-items:center;justify-content:space-between;margin:17px 0 8px}.activity-head strong{font:700 10px/1 var(--mono);letter-spacing:.08em}.activity-head span{color:#858b81;font:500 9px/1 var(--mono)}.event{position:relative;min-height:58px;padding:11px 9px 10px 43px;border-top:1px solid var(--line)}.event::before{content:"";position:absolute;left:13px;top:17px;width:9px;height:9px;border:2px solid var(--orange);background:var(--carbon)}.event::after{content:"";position:absolute;left:18px;top:29px;bottom:-12px;width:1px;background:var(--line)}.event:last-child::after{display:none}.event-top{display:flex;justify-content:space-between;gap:10px}.event strong{font-size:11px}.event time{color:#7f867b;font:500 9px/1 var(--mono)}.event p{margin:4px 0 0;color:#989f94;font-size:10px;line-height:1.45}.event.ok::before{border-color:var(--green)}
    .command-dock{position:absolute;z-index:15;left:12px;right:12px;bottom:12px;min-height:78px;padding:8px;border:1px solid rgba(255,255,255,.2);background:rgba(31,34,29,.94);box-shadow:0 18px 40px rgba(0,0,0,.3);backdrop-filter:blur(18px)}.command-dock form{display:grid;grid-template-columns:1fr 48px;gap:7px}.command-dock input{min-width:0;height:48px;padding:0 12px;border:1px solid var(--line);outline:0;color:#fff;background:#11130f;font-size:12px}.command-dock input::placeholder{color:#747b70}.send-voice{height:48px;border:0;display:grid;place-items:center;color:#fff;background:var(--orange)}.dock-meta{display:flex;justify-content:space-between;margin-top:7px;color:#777e73;font:500 8px/1 var(--mono)}.listening-strip{position:absolute;z-index:25;left:12px;right:12px;bottom:12px;height:98px;padding:15px;color:#181a16;background:var(--orange);display:none}.listening .listening-strip{display:block;animation:rise .25s var(--ease)}@keyframes rise{from{opacity:0;transform:translateY(14px)}}.listen-head{display:flex;justify-content:space-between;align-items:center;font:800 10px/1 var(--mono);letter-spacing:.06em}.stop{width:38px;height:38px;border:1px solid rgba(16,18,15,.35);background:transparent;display:grid;place-items:center}.bars{height:32px;margin-top:4px;display:flex;align-items:center;gap:4px}.bars i{width:3px;height:9px;background:var(--carbon);animation:bar .8s ease-in-out infinite}.bars i:nth-child(2n){animation-delay:-.22s}.bars i:nth-child(3n){animation-delay:-.45s}.bars i:nth-child(5n){animation-delay:-.62s}@keyframes bar{50%{height:28px}}

    /* Launcher as an operations dashboard instead of an icon page. */
    .workspace{flex:1;overflow:auto;padding:15px 14px 88px;scrollbar-width:none}.workspace::-webkit-scrollbar{display:none}.workspace-title{display:flex;align-items:end;justify-content:space-between;margin:2px 2px 14px}.workspace-title h2{margin:0;font-size:29px;line-height:1;letter-spacing:-.045em}.workspace-title span{color:#8c9388;font:600 9px/1.3 var(--mono);text-align:right}.module-grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:109px;gap:8px}.module{position:relative;overflow:hidden;padding:13px;border:1px solid var(--line);text-align:left;color:#fff;background:var(--panel)}.module.wide{grid-column:1/3;grid-row:span 2;color:var(--ink);background:var(--paper)}.module.tall{grid-row:span 2}.module-tag{display:flex;justify-content:space-between;color:#959c91;font:600 8px/1 var(--mono);letter-spacing:.07em}.module.wide .module-tag{color:#62685e}.module h3{margin:10px 0 0;font-size:16px;line-height:1.15}.module p{margin:5px 0 0;color:#959d92;font-size:10px;line-height:1.45}.module.wide p{max-width:210px;color:#5d6359}.module-icon{width:40px;height:40px;margin-top:16px;display:grid;place-items:center;color:#fff;background:var(--orange)}.module.tall .module-icon{margin-top:19px}.agent-terminal{position:absolute;right:-14px;bottom:-12px;width:170px;height:117px;padding:12px;color:#abb2a6;background:var(--carbon);font:500 8px/1.8 var(--mono);transform:rotate(-2deg)}.agent-terminal b{display:block;color:var(--green);font-weight:600}.travel-module{background:var(--orange);color:#181a16}.travel-module .module-tag,.travel-module p{color:#5f2617}.travel-module .module-icon{color:var(--orange);background:var(--carbon)}.meter{position:absolute;left:13px;right:13px;bottom:13px;height:4px;background:#33372f}.meter i{display:block;width:36%;height:100%;background:var(--green)}
    .system-rail{position:absolute;z-index:12;left:12px;right:12px;bottom:11px;height:62px;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;border:1px solid var(--line);background:rgba(21,23,19,.94);backdrop-filter:blur(18px)}.system-rail button{border:0;color:#858c81;background:transparent;font:650 9px/1 var(--mono)}.system-rail button.active{color:#171914;background:var(--paper)}

    /* Build workbench: files, diff, checks, then an unmistakable host-owned gate. */
    .build-top{height:54px;flex:none;padding:0 11px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.back{width:44px;height:44px;border:0;display:grid;place-items:center;color:#fff;background:transparent}.build-title{flex:1}.build-title span{display:block;color:#8d9489;font:500 8px/1 var(--mono)}.build-title strong{display:block;margin-top:3px;font-size:12px}.version{padding:6px 7px;border:1px solid rgba(255,107,61,.5);color:#ffad93;font:650 9px/1 var(--mono)}.build-scroll{flex:1;overflow:auto;padding:13px 12px 229px;scrollbar-width:none}.build-scroll::-webkit-scrollbar{display:none}.pipeline{height:46px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}.pipe{position:relative;display:grid;place-items:center;color:#777f74;font:600 8px/1 var(--mono);border-right:1px solid var(--line)}.pipe:last-child{border:0}.pipe.done{color:#1b1d19;background:var(--green)}.pipe.current{color:#fff;background:#332219}.pipe.current::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:var(--orange)}.workbench{height:244px;margin-top:9px;display:grid;grid-template-columns:105px 1fr;border:1px solid var(--line);background:#151713}.file-tree{padding:10px 8px;border-right:1px solid var(--line);font:500 8px/1.9 var(--mono);color:#7e857a}.file-tree strong{display:block;margin-bottom:6px;color:#c6cbc1;font-size:8px;letter-spacing:.05em}.file-tree span{display:block;white-space:nowrap}.file-tree span.active{margin-left:-8px;padding-left:8px;color:#fff;background:#2c3029;border-left:2px solid var(--orange)}.diff{overflow:hidden}.diff-head{height:31px;padding:0 9px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);color:#aeb4aa;font:600 8px/1 var(--mono)}.diff-head b{color:var(--green);font-weight:600}.code{padding:8px 0;color:#b8beb4;font:500 7.5px/1.65 var(--mono);white-space:nowrap}.code span{display:block;padding:0 8px}.code i{display:inline-block;width:18px;color:#5f665c;font-style:normal}.code .addline{color:#c8e9aa;background:rgba(77,111,47,.22)}.code .orange{color:#ff9c7e}.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.check-card{min-height:54px;padding:9px;border:1px solid var(--line)}.check-card span{display:block;color:#7f867c;font:600 8px/1 var(--mono)}.check-card strong{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:10px}.check-card strong i{width:7px;height:7px;background:var(--green)}
    .system-gate{position:absolute;z-index:30;left:9px;right:9px;bottom:8px;color:var(--ink);background:var(--paper);box-shadow:0 -20px 55px rgba(0,0,0,.4)}.gate-mark{height:27px;padding:0 11px;display:flex;align-items:center;justify-content:space-between;color:#fff;background:var(--orange);font:800 8px/1 var(--mono);letter-spacing:.08em}.gate-mark span:last-child{color:#4d1d10}.gate-body{padding:12px}.gate-head{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center}.gate-icon{width:38px;height:38px;display:grid;place-items:center;color:#fff;background:var(--carbon)}.gate-head strong{display:block;font-size:13px}.gate-head span{display:block;margin-top:3px;color:#686e64;font-size:9px}.scope{margin:11px 0;padding:9px 0;display:grid;grid-template-columns:25px 1fr auto;gap:8px;align-items:center;border-top:1px solid rgba(21,23,19,.15);border-bottom:1px solid rgba(21,23,19,.15)}.scope svg{width:17px}.scope strong{display:block;font-size:10px}.scope small{display:block;margin-top:2px;color:#71776d;font-size:8px}.scope b{font:700 8px/1 var(--mono)}.allow{width:100%;min-height:45px;border:0;color:#fff;background:var(--carbon);font-size:11px;font-weight:700}.deny{width:100%;height:32px;border:0;color:#72786f;background:transparent;font-size:9px}

    /* Generated app deliberately switches to paper to expose the sandbox boundary. */
    .runtime{color:var(--ink);background:var(--paper)}.hostbar{height:58px;flex:none;padding:5px 9px;display:flex;align-items:center;color:#fff;background:var(--carbon);border-bottom:3px solid var(--orange)}.hostbar .back{width:42px;height:42px}.host-name{flex:1}.host-name strong{display:block;font-size:11px}.host-name span{display:block;margin-top:3px;color:#899086;font:500 7.5px/1 var(--mono)}.inspect{height:38px;padding:0 9px;border:1px solid var(--line);color:#ffad93;background:#1c1f1a;font:650 8px/1 var(--mono)}.trip-app{flex:1;overflow:auto;padding:18px 16px 35px;background:var(--paper);scrollbar-width:none}.trip-app::-webkit-scrollbar{display:none}.trip-meta{display:flex;justify-content:space-between;color:#697067;font:700 9px/1 var(--mono);letter-spacing:.07em}.trip-app h2{margin:18px 0 6px;max-width:310px;font-size:38px;line-height:.98;letter-spacing:-.055em}.trip-app>p{margin:0;color:#666c63;font-size:11px}.progress-block{margin:19px 0 17px;padding:13px;color:#fff;background:var(--carbon)}.progress-top{display:flex;justify-content:space-between;font:650 10px/1 var(--mono)}.progress-top b{color:var(--green)}.progress-line{height:5px;margin-top:11px;background:#3b3f37}.progress-line i{display:block;height:100%;background:var(--orange);transition:width .25s var(--ease)}.list-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.list-title strong{font-size:12px}.list-title span{color:#727970;font:600 9px/1 var(--mono)}.task{min-height:57px;display:grid;grid-template-columns:31px 1fr auto;gap:9px;align-items:center;border-top:1px solid #cac7be}.task:last-of-type{border-bottom:1px solid #cac7be}.check{width:27px;height:27px;display:grid;place-items:center;border:1.5px solid #858a82;background:#f8f7f2}.task.done .check{color:#fff;border-color:var(--orange);background:var(--orange)}.task.done .task-name{text-decoration:line-through;color:#8b9088}.task-name{font-size:11px;font-weight:600}.task-time{color:#747b71;font:600 8px/1 var(--mono)}.add{width:100%;height:46px;margin-top:12px;border:1px dashed #8c9189;color:#555c53;background:transparent;font:650 9px/1 var(--mono)}.modify-bar{position:absolute;z-index:10;left:14px;right:14px;bottom:12px;height:48px;border:0;color:#fff;background:var(--orange);font-size:11px;font-weight:700;box-shadow:0 10px 28px rgba(48,24,15,.2)}
    .toast{position:absolute;z-index:90;left:50%;bottom:24px;max-width:330px;padding:10px 13px;transform:translateX(-50%);white-space:nowrap;color:#fff;background:var(--carbon);border:1px solid var(--orange);font:600 9px/1.2 var(--mono);animation:toast 2.25s both}@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

    .prototype-note{width:1355px;margin-top:27px;padding:16px 18px;display:flex;justify-content:space-between;gap:28px;color:#51564e;background:rgba(242,240,233,.62);border:1px solid rgba(16,18,15,.22);font-size:12px;line-height:1.65}.prototype-note strong{color:var(--ink)}.prototype-note kbd{padding:4px 7px;color:#fff;background:var(--orange);font:700 10px/1 var(--mono)}
    @media(max-width:760px){.board{padding:24px 18px 40px}.board-head{width:326px;display:block}.board h1{font-size:39px}.board-copy{margin-top:15px}.phones{gap:14px}.prototype-note{width:326px;display:block}.prototype-note div+div{margin-top:8px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="board">
    <header class="board-head">
      <div><div class="eyebrow">Direction C · Agent Studio</div><h1>不只看到结果，<br>也看见 AI 的<em>每一步</em>。</h1></div>
      <p class="board-copy"><strong>设计判断：</strong>把 Agent 的计划、文件变更、权限与版本状态变成系统的一等信息。默认界面保持清晰的渐进披露，但高级用户随时可以追溯“做了什么、为何这样做”。</p>
    </header>
    <section class="phones" id="phones" aria-label="四个可交互移动端原型状态"></section>
    <footer class="prototype-note"><div><strong>可点击：</strong>命令建议、语音键、工作区模块、文件构建、系统授权、沙箱状态、清单项目和 AI 修改。</div><div><kbd>C</kbd> Agent 工作台 · 碳黑 / 纸白 / 信号橙</div></footer>
  </main>
  <script>
    const I={
      grid:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
      mic:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg>',
      close:'<svg class="i" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>',
      back:'<svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
      terminal:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>',
      trip:'<svg class="i" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5c0-1 1-2 3-2s3 1 3 2v2M9 11v5M15 11v5"/></svg>',
      folder:'<svg class="i" viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/></svg>',
      store:'<svg class="i" viewBox="0 0 24 24"><path d="M5 9v11h14V9M3 9l2-5h14l2 5"/><path d="M3 9c0 2 3 2 4.5 0 1.5 2 3.5 2 4.5 0 1 2 3 2 4.5 0 1.5 2 4.5 2 4.5 0"/></svg>',
      shield:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.6 2.8 8 7 10 4.2-2 7-5.4 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>',
      storage:'<svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>',
      check:'<svg class="i" viewBox="0 0 24 24"><path d="m6 12 4 4 8-9"/></svg>',
      plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
      eye:'<svg class="i" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>',
      spark:'<svg class="i" viewBox="0 0 24 24"><path d="m12 3 1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3ZM19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15Z"/></svg>'
    };
    const defs=[['01','AI 命令与活动流','assistant'],['02','模块化系统桌面','launcher'],['03','文件、Diff 与系统授权','build'],['04','HTML App 沙箱运行态','app']];
    const states=new WeakMap();
    function chrome(){return `<div class="status-bar"><span>9:41</span><div class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg class="wifi" viewBox="0 0 16 12"><path d="M8 11.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" fill="currentColor"/><path d="M3 7.5a7 7 0 0 1 10 0M1 4.5a11 11 0 0 1 14 0" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg><span class="battery"></span></div></div><div class="dynamic-island"></div>`}
    function shellTop(action='launcher'){return `<header class="shell-top"><span class="shell-id"><i></i>DAILY / AGENT 01</span><span class="agent-state"><i></i>ONLINE</span><button class="top-action" data-nav="${action}" aria-label="${action==='launcher'?'打开系统桌面':'回到 AI'}">${action==='launcher'?I.grid:I.spark}</button></header>`}
    function assistant(s){return `<section class="screen assistant">${shellTop('launcher')}<div class="assistant-scroll"><div class="command-kicker"><span>COMMAND SURFACE</span><b>CONTEXT: 2</b></div><div class="command-hero"><h2>${s.chat?'已拆解为 4 个可审计步骤。':'描述目标，剩下的交给系统。'}</h2><p>${s.chat?'我只会创建一个静态 HTML App，并把文件、权限和版本记录留给你检查。':'Daily 会先解释计划和权限，再生成、预览并安装；没有确认，不会替你跨过系统边界。'}</p>${s.chat?`<div class="request">给我做一个旅行清单 App，按日期整理，离线可用。</div><article class="agent-plan"><div class="plan-head"><span>PLAN / 04 STEPS</span><span>LOW RISK</span></div><div class="plan-copy">生成 4 个静态文件 → 建立离线数据层 → 安全扫描 → 请求 App 私有存储。</div><button class="plan-action" data-nav="build">检查文件与权限</button></article>`:`<div class="trace-row"><span data-action="prompt" role="button" tabindex="0">+ 创建旅行清单 App</span><span>整理今日文件</span><span>检查空间用量</span></div>`}</div><div class="activity-head"><strong>AGENT ACTIVITY</strong><span>TRACE ENABLED</span></div><div class="event ok"><div class="event-top"><strong>上下文已就绪</strong><time>09:40:58</time></div><p>只读取「京都 5 日」文件夹的名称与日期，没有打开文件内容。</p></div><div class="event"><div class="event-top"><strong>等待你的新目标</strong><time>NOW</time></div><p>工具、文件和安装权限将在实际使用前逐项确认。</p></div></div><div class="command-dock"><form data-compose><input aria-label="向 Daily 下达命令" placeholder="输入目标或 / 命令…"><button type="button" class="send-voice" data-action="voice" aria-label="语音输入">${I.mic}</button></form><div class="dock-meta"><span>ENTER TO RUN</span><span>MIC READY / LOCAL BUFFER</span></div></div><div class="listening-strip"><div class="listen-head"><span>ASR / LISTENING</span><button class="stop" data-action="voice" aria-label="停止录音">${I.close}</button></div><div class="bars">${'<i></i>'.repeat(20)}</div></div></section>`}
    function launcher(){return `<section class="screen">${shellTop('assistant')}<div class="workspace"><div class="workspace-title"><h2>系统工作区</h2><span>SPACE 01<br>6 MODULES</span></div><div class="module-grid"><button class="module wide" data-nav="assistant"><span class="module-tag"><span>01 / DAILY AGENT</span><span>ACTIVE</span></span><h3>从目标继续，而不是从 App 开始。</h3><p>最近上下文：京都旅行 · 旅行清单 v1.0.0</p><span class="agent-terminal"><b>agent.ready = true</b>tools: scoped<br>trace: enabled<br>next: user_goal</span></button><button class="module tall travel-module" data-nav="app"><span class="module-tag"><span>02 / APP</span><span>NEW</span></span><span class="module-icon">${I.trip}</span><h3>旅行清单</h3><p>8 项待确认<br>本地离线数据</p></button><button class="module"><span class="module-tag"><span>03 / FILES</span><span>1.8G</span></span><span class="module-icon">${I.folder}</span><h3>文件</h3></button><button class="module"><span class="module-tag"><span>04 / STORE</span><span>SAFE</span></span><span class="module-icon">${I.store}</span><h3>App 市集</h3></button><button class="module wide"><span class="module-tag"><span>05 / RESOURCE LEDGER</span><span>36%</span></span><h3>资源与权限账本</h3><p>云空间 1.8 / 5 GB · 本月 AI 用量 42%</p><span class="meter"><i></i></span></button></div></div><nav class="system-rail"><button class="active" data-nav="assistant">AGENT</button><button data-nav="app">APPS</button><button>FILES</button></nav></section>`}
    function build(){return `<section class="screen"><header class="build-top"><button class="back" data-nav="assistant" aria-label="返回 AI">${I.back}</button><span class="build-title"><span>AGENT RUN / A-1042</span><strong>旅行清单</strong></span><span class="version">v1.0.0 IMMUTABLE</span></header><div class="build-scroll"><div class="pipeline"><span class="pipe done">PLAN ✓</span><span class="pipe done">BUILD ✓</span><span class="pipe current">SCAN 78%</span><span class="pipe">INSTALL</span></div><section class="workbench"><aside class="file-tree"><strong>APP PACKAGE / 4</strong><span class="active">index.html</span><span>styles.css</span><span>app.js</span><span>manifest.json</span><span>—</span><span>offline: true</span><span>network: none</span></aside><div class="diff"><div class="diff-head"><span>index.html</span><b>+42 / −0</b></div><div class="code"><span><i>01</i>&lt;main class=<span class="orange">"trip"</span>&gt;</span><span class="addline"><i>02</i>+ &lt;header&gt;京都 / 5 日&lt;/header&gt;</span><span class="addline"><i>03</i>+ &lt;h1&gt;出发前清单&lt;/h1&gt;</span><span><i>04</i>&lt;section id=<span class="orange">"tasks"</span>&gt;</span><span class="addline"><i>05</i>+ &lt;button data-date="today"&gt;</span><span class="addline"><i>06</i>+ 确认护照有效期</span><span class="addline"><i>07</i>+ &lt;/button&gt;</span><span><i>08</i>&lt;/section&gt;</span><span><i>09</i>&lt;script src="app.js"&gt;&lt;/script&gt;</span></div></div></section><div class="check-grid"><div class="check-card"><span>STATIC SCAN</span><strong><i></i>NO HIGH RISK</strong></div><div class="check-card"><span>NETWORK</span><strong><i></i>0 REQUESTS</strong></div><div class="check-card"><span>OFFLINE TEST</span><strong><i></i>PASS</strong></div><div class="check-card"><span>ROLLBACK</span><strong><i></i>AVAILABLE</strong></div></div></div><aside class="system-gate"><div class="gate-mark"><span>SYSTEM GATE / HOST OWNED</span><span>APP 无法伪造</span></div><div class="gate-body"><div class="gate-head"><span class="gate-icon">${I.shield}</span><span><strong>安装前确认 1 项能力</strong><span>授权对象：旅行清单 · v1.0.0</span></span></div><div class="scope">${I.storage}<span><strong>App 私有存储</strong><small>不能读取「文件」或其他 App 数据</small></span><b>LOCAL</b></div><button class="allow" data-nav="app">允许、安装并打开</button><button class="deny" data-nav="assistant">拒绝并返回</button></div></aside></section>`}
    function app(s){const tasks=[['确认护照有效期','TODAY'],['预订机场巴士','JUL 31'],['下载离线地图','OFFLINE'],['整理每日穿搭','OPTIONAL']];const count=s.done.size+2;return `<section class="screen runtime"><header class="hostbar"><button class="back" data-nav="launcher" aria-label="返回系统桌面">${I.back}</button><span class="host-name"><strong>旅行清单</strong><span>SANDBOX / v1.0.0 / NETWORK: OFF</span></span><button class="inspect" data-action="inspect">${I.eye} 状态</button></header><div class="trip-app"><div class="trip-meta"><span>KYOTO / 5 DAYS</span><span>31 JUL → 04 AUG</span></div><h2>出发前，<br>逐项确认。</h2><p>数据只保存在此 App 的独立空间。</p><article class="progress-block"><div class="progress-top"><span>READINESS</span><b>${count} / 8</b></div><div class="progress-line"><i style="width:${count/8*100}%"></i></div></article><div class="list-title"><strong>今天与出发前</strong><span>${tasks.length-s.done.size} OPEN</span></div>${tasks.map((t,i)=>`<div class="task ${s.done.has(i)?'done':''}" data-task="${i}" role="button" tabindex="0"><span class="check">${s.done.has(i)?I.check:''}</span><span class="task-name">${t[0]}</span><span class="task-time">${t[1]}</span></div>`).join('')}<button class="add" data-action="add">${I.plus} ADD ITEM</button></div><button class="modify-bar" data-action="modify">让 Daily 基于 v1.0.0 创建新版本</button></section>`}
    function render(f){const s=states.get(f);f.classList.toggle('listening',s.listening);f.querySelector('.app-content').innerHTML=s.screen==='launcher'?launcher():s.screen==='build'?build():s.screen==='app'?app(s):assistant(s)}
    function nav(f,to){const s=states.get(f);s.screen=to;s.listening=false;render(f)}
    function toast(f,text){f.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=text;f.querySelector('.ios-screen').append(e);setTimeout(()=>e.remove(),2300)}
    function phone(initial){const f=document.createElement('div');f.className='ios-frame';f.innerHTML=`<div class="ios-screen">${chrome()}<div class="app-content"></div><div class="home-indicator"></div></div>`;states.set(f,{screen:initial,chat:initial!=='assistant',listening:false,done:new Set()});f.addEventListener('click',e=>{const s=states.get(f),n=e.target.closest('[data-nav]'),a=e.target.closest('[data-action]'),t=e.target.closest('[data-task]');if(n){nav(f,n.dataset.nav);return}if(t){const i=+t.dataset.task;s.done.has(i)?s.done.delete(i):s.done.add(i);render(f);return}if(a?.dataset.action==='voice'){s.listening=!s.listening;render(f);return}if(a?.dataset.action==='prompt'){s.chat=true;render(f);return}if(a?.dataset.action==='modify'){s.screen='assistant';s.chat=true;render(f);setTimeout(()=>toast(f,'CONTEXT ATTACHED / 旅行清单 v1.0.0'),20);return}if(a?.dataset.action==='inspect'){toast(f,'SANDBOX OK / PRIVATE STORAGE / NETWORK OFF');return}if(a?.dataset.action==='add'){toast(f,'PROTOTYPE / 将打开自然语言新增输入')}});f.addEventListener('submit',e=>{e.preventDefault();states.get(f).chat=true;render(f)});f.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-task],[data-action="prompt"]')){e.preventDefault();e.target.click()}});render(f);return f}
    const root=document.getElementById('phones');defs.forEach(([n,label,initial])=>{const u=document.createElement('article');u.className='unit';u.innerHTML=`<div class="unit-label"><strong>${label}</strong><span>${n}</span></div><div class="phone-scale"></div>`;u.querySelector('.phone-scale').append(phone(initial));root.append(u)});
  </script>
</body>
