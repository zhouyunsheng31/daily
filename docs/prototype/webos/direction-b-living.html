  <style>
    :root {

    *{box-sizing:border-box} html{background:#050a09} body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--font);line-break:strict;background:#050a09;overflow-x:auto}

    .eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:13px;color:var(--mint);font-size:11px;font-weight:750;letter-spacing:.15em;text-transform:uppercase}.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 22px var(--coral)}
    h1{margin:0;max-width:800px;font-size:clamp(40px,4.4vw,66px);line-height:1.01;letter-spacing:-.052em;font-weight:610;text-wrap:balance}h1 em{font-style:normal;color:var(--mint)}
    .board-copy{margin:0 0 4px;color:#aeb9b2;font-size:14px;line-height:1.72;text-wrap:pretty}.board-copy strong{color:#fff;font-weight:650}
    .phones{position:relative;display:flex;gap:17px;align-items:flex-start}.unit{width:326px}.unit-label{height:42px;padding:0 4px;display:flex;justify-content:space-between;color:#8f9c94;font-size:12px}.unit-label strong{font-size:13px;color:#eaf0eb;font-weight:650}.unit-label span:last-child{font-variant-numeric:tabular-nums;color:var(--mint)}.phone-scale{width:326px;height:684px;position:relative}

    .app-content{position:absolute;inset:54px 0 34px;overflow:hidden;z-index:3}.home-indicator{position:absolute;z-index:45;left:50%;bottom:10px;transform:translateX(-50%);width:140px;height:5px;border-radius:99px;background:rgba(255,255,255,.52)}
    .screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--night);animation:enter .5s var(--ease)}@keyframes enter{from{opacity:0;transform:scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

    .top{position:relative;z-index:4;min-height:50px;padding:7px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:15px;font-weight:720;letter-spacing:-.03em}.live{display:flex;gap:7px;align-items:center;color:#aab6ae;font-size:11px}.live i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint)}.circle-btn{width:42px;height:42px;border:1px solid var(--edge);border-radius:50%;background:rgba(17,32,27,.58);display:grid;place-items:center;transition:.2s}.circle-btn:active,.main-action:active{transform:scale(.95)}

    /* Assistant: voice-centered spatial composition. */
    .assistant-main{position:relative;z-index:3;flex:1;padding:4px 18px 136px;display:flex;flex-direction:column;align-items:center}.context-float{align-self:stretch;min-height:71px;border-radius:22px;padding:13px 14px;display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center}.context-mark{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;color:#12251e;background:var(--mint)}.context-copy strong{display:block;font-size:12px}.context-copy span{display:block;margin-top:3px;color:#aeb9b2;font-size:10px}.context-float .num{font-size:11px;color:var(--sun);font-variant-numeric:tabular-nums}
    .orb-stage{position:relative;width:230px;height:230px;margin-top:38px;display:grid;place-items:center}.orbit{position:absolute;inset:9px;border:1px solid rgba(155,229,194,.2);border-radius:44% 56% 55% 45%;animation:orbit 12s linear infinite}.orbit.b{inset:31px;border-color:rgba(255,130,107,.24);border-radius:58% 42% 47% 53%;animation-duration:9s;animation-direction:reverse}@keyframes orbit{to{transform:rotate(360deg)}}
    .orb{position:relative;width:126px;height:126px;border:0;border-radius:46% 54% 58% 42%;background:radial-gradient(circle at 35% 28%,#e6fff2 0 5%,#a2e6c5 23%,#4d9a78 48%,#132c23 74%);box-shadow:0 0 58px rgba(155,229,194,.3),inset -13px -18px 30px rgba(0,0,0,.28);animation:breathe 5s var(--ease) infinite;transition:.4s var(--ease)}.orb::after{content:"";position:absolute;inset:14px;border-radius:inherit;border:1px solid rgba(255,255,255,.35);filter:blur(.2px)}@keyframes breathe{50%{transform:scale(1.055) rotate(3deg);border-radius:56% 44% 45% 55%;box-shadow:0 0 78px rgba(155,229,194,.4),inset -13px -18px 30px rgba(0,0,0,.24)}}.listening .orb{transform:scale(1.18);background:radial-gradient(circle at 34% 30%,#fff4df,#ffb38f 29%,#c85d4b 55%,#381d18 80%);box-shadow:0 0 84px rgba(255,130,107,.44)}

    .float-composer{position:absolute;z-index:12;left:15px;right:15px;bottom:14px;min-height:65px;border-radius:27px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px}.float-composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px}.float-composer input::placeholder{color:#9ba8a0}.main-action{width:49px;height:49px;border:0;border-radius:50%;display:grid;place-items:center;color:#10231c;background:var(--mint);box-shadow:0 9px 28px rgba(155,229,194,.22);transition:.2s}.listen-copy{display:none}.listening .idle-copy{display:none}.listening .listen-copy{display:block;color:#ffd0c6}

    /* Living launcher: bento home rather than icon-only grid. */
    .launcher-inner{position:relative;z-index:3;flex:1;overflow:auto;padding:5px 17px 104px;scrollbar-width:none}.launcher-inner::-webkit-scrollbar{display:none}.space-head{display:flex;align-items:end;justify-content:space-between;margin:3px 2px 17px}.space-head h2{margin:0;font-size:29px;font-weight:570;letter-spacing:-.045em}.space-head span{color:#9ca9a1;font-size:11px}.bento{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:102px;gap:10px}.tile{position:relative;border:1px solid var(--edge);border-radius:25px;overflow:hidden;background:rgba(17,31,27,.64);padding:15px;text-align:left}.tile.big{grid-column:1/3;grid-row:span 2;background:linear-gradient(145deg,rgba(155,229,194,.25),rgba(16,42,33,.69) 57%,rgba(255,130,107,.12));}.tile.tall{grid-row:span 2}.tile-icon{width:40px;height:40px;border-radius:15px;display:grid;place-items:center;margin-bottom:12px;color:#10231c;background:var(--mint)}.tile-icon.coral{background:var(--coral);color:#29120e}.tile-icon.sun{background:var(--sun);color:#2a220e}.tile h3{margin:0;font-size:15px;font-weight:620}.tile p{margin:4px 0 0;color:#aab6af;font-size:10px;line-height:1.45}.tile.big h3{position:absolute;left:17px;bottom:42px;font-size:22px;letter-spacing:-.035em}.tile.big p{position:absolute;left:17px;bottom:18px}.tile .mini-orb{position:absolute;width:135px;height:135px;border-radius:47% 53%;right:-25px;top:-24px;background:radial-gradient(circle at 35% 30%,#dffff0,#82cfab 28%,#2d6c51 56%,transparent 72%);filter:drop-shadow(0 0 24px rgba(155,229,194,.24))}.pager{display:flex;justify-content:center;gap:5px;margin-top:16px}.pager i{width:5px;height:5px;border-radius:50%;background:#52625a}.pager i:first-child{width:19px;border-radius:5px;background:var(--mint)}
    .dock{position:absolute;z-index:10;left:17px;right:17px;bottom:16px;height:74px;border-radius:28px;display:flex;align-items:center;justify-content:space-around;padding:8px}.dock button{width:52px;height:52px;border:0;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.07)}.dock button.active{color:#10231c;background:var(--mint)}

    /* Build as a live spatial process. */
    .build-body{position:relative;z-index:3;flex:1;padding:4px 17px 228px;overflow:auto;scrollbar-width:none}.build-body::-webkit-scrollbar{display:none}.build-title{display:flex;align-items:center;gap:9px}.back{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;margin-left:-9px}.build-title-copy{flex:1}.build-title-copy span{display:block;color:#97a59d;font-size:10px}.build-title-copy strong{display:block;margin-top:2px;font-size:15px}.version{padding:6px 8px;border:1px solid var(--edge);border-radius:99px;color:var(--mint);font-size:10px;font-variant-numeric:tabular-nums}.build-core{position:relative;height:215px;display:grid;place-items:center;margin-top:4px}.core-ring{position:absolute;width:174px;height:174px;border-radius:50%;background:conic-gradient(var(--mint) 0 78%,rgba(255,255,255,.08) 78%);mask:radial-gradient(circle,transparent 61%,#000 62%);animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.core-orb{width:112px;height:112px;border-radius:45% 55%;background:radial-gradient(circle at 35% 30%,#effff5,#9be5c2 25%,#326d53 57%,#13251f 78%);box-shadow:0 0 52px rgba(155,229,194,.3);animation:breathe 4s var(--ease) infinite}.percent{position:absolute;bottom:7px;font-size:11px;color:#b6c2bb;font-variant-numeric:tabular-nums}.build-stream{display:flex;gap:7px;overflow:hidden}.stream-chip{flex:none;padding:9px 11px;border:1px solid var(--edge);border-radius:13px;color:#aebbb3;background:rgba(14,27,23,.55);font:500 10px/1.2 ui-monospace,"SF Mono",monospace}.stream-chip.ok{color:#15251f;background:var(--mint)}.build-summary{margin-top:12px;border-radius:22px;padding:14px 15px}.sum-row{min-height:37px;display:flex;align-items:center;gap:9px;font-size:11px}.sum-row+ .sum-row{border-top:1px solid rgba(255,255,255,.09)}.sum-row svg{width:16px;height:16px;color:var(--mint)}.sum-row span:last-child{margin-left:auto;color:#839088;font-size:10px}
    .permission{position:absolute;z-index:20;left:12px;right:12px;bottom:10px;border-radius:30px;padding:16px;background:rgba(240,247,241,.94);color:#112019;box-shadow:0 -16px 60px rgba(0,0,0,.35);backdrop-filter:blur(32px)}.handle{width:34px;height:4px;border-radius:9px;background:#b9c6bd;margin:0 auto 14px}.perm-head{display:flex;gap:11px;align-items:center}.perm-badge{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;color:#10231c;background:var(--mint)}.perm-head strong{display:block;font-size:14px}.perm-head span{display:block;margin-top:3px;color:#657169;font-size:10px}.perm-scope{display:flex;align-items:center;gap:10px;margin:13px 0;padding:11px 0;border-top:1px solid rgba(17,32,25,.12);border-bottom:1px solid rgba(17,32,25,.12)}.perm-scope strong{display:block;font-size:12px}.perm-scope small{display:block;margin-top:2px;color:#647168;font-size:10px}.install{width:100%;min-height:48px;border:0;border-radius:17px;background:#10261d;color:#effff7;font-weight:650;font-size:13px}.deny{width:100%;height:38px;border:0;background:transparent;color:#68756d;font-size:11px}

    /* Generated app: immersive card timeline. */
    .runtime{background:#0a1512}.hostbar{position:relative;z-index:5;height:54px;padding:5px 12px;display:flex;align-items:center;gap:7px;background:rgba(7,16,14,.78);border-bottom:1px solid var(--edge);backdrop-filter:blur(25px)}.hostbar .back{margin:0;width:40px;height:40px}.host-name{flex:1}.host-name strong{display:block;font-size:12px}.host-name span{display:block;margin-top:2px;color:#89978f;font-size:9px;font-variant-numeric:tabular-nums}.modify{height:38px;border:1px solid rgba(155,229,194,.26);border-radius:13px;background:rgba(155,229,194,.1);color:var(--mint);font-size:10px;font-weight:650}
    .travel{position:relative;z-index:3;flex:1;overflow:auto;padding:17px 17px 35px;scrollbar-width:none}.travel::-webkit-scrollbar{display:none}.travel-hero{position:relative;min-height:194px;padding:18px;border-radius:28px;overflow:hidden;background:linear-gradient(145deg,#d6f4e4 0%,#8fd2b2 53%,#e9bd74 135%);color:#102019}.travel-hero::after{content:"";position:absolute;width:190px;height:190px;border:1px solid rgba(16,32,25,.18);border-radius:48% 52%;right:-70px;top:-70px}.travel-kicker{font-size:10px;letter-spacing:.12em}.travel-hero h2{margin:12px 0 5px;font-size:31px;line-height:1.05;letter-spacing:-.05em}.travel-hero p{margin:0;font-size:11px;color:#435a4f}.ring-progress{position:absolute;right:17px;bottom:16px;width:65px;height:65px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#173d2d var(--p),rgba(255,255,255,.45) 0);font-size:12px;font-weight:700}.ring-progress::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#b6e3ca}.ring-progress span{position:relative;font-variant-numeric:tabular-nums}.day{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}.day strong{font-size:13px}.day span{color:#849189;font-size:10px}.task{min-height:57px;border:1px solid var(--edge);border-radius:18px;margin-top:8px;padding:9px 11px;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:rgba(17,32,27,.64)}.task .check{width:28px;height:28px;border:1px solid #5e7167;border-radius:10px;display:grid;place-items:center}.task.done .check{background:var(--mint);border-color:var(--mint);color:#10231c}.task.done .task-name{text-decoration:line-through;color:#738078}.task-name{font-size:12px}.task-meta{color:#829087;font-size:9px;font-variant-numeric:tabular-nums}.add{width:100%;height:46px;margin-top:10px;border:1px dashed #4c6257;border-radius:16px;background:transparent;color:#9caaa2;font-size:11px}.toast{position:absolute;z-index:60;left:50%;bottom:24px;transform:translateX(-50%);white-space:nowrap;padding:10px 14px;border-radius:99px;color:#13251e;background:var(--mint);font-size:10px;font-weight:650;animation:toast 2.2s both}@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

    .prototype-note{width:1352px;margin-top:27px;padding:18px 20px;border:1px solid rgba(255,255,255,.13);display:flex;justify-content:space-between;gap:30px;color:#96a39b;font-size:12px;line-height:1.65}.prototype-note strong{color:#eef4ef}.prototype-note kbd{padding:4px 7px;border:1px solid rgba(255,255,255,.2);border-bottom-width:2px;border-radius:7px;background:rgba(255,255,255,.06);color:var(--mint);font:650 11px/1 var(--font)}
    @media(max-width:760px){.board{padding:24px 18px 40px}.board-head{width:326px;display:block}.board h1{font-size:39px}.board-copy{margin-top:14px}.phones{gap:14px}.prototype-note{width:326px;display:block}.prototype-note div+div{margin-top:8px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>

<body>
  <main class="board">
    <header class="board-head"><div><div class="eyebrow">Direction B · Living Space</div><h1>AI 不是一个页面，<br>而是空间里<em>活着的核心</em>。</h1></div><p class="board-copy"><strong>设计判断：</strong>让语音、环境和个性化成为第一感受。App 围绕 AI 展开成动态空间；玻璃、光和流体只表达层级与生命感，同时预留性能降级。</p></header>
    <section class="phones" id="phones" aria-label="四个可交互移动端原型状态"></section>
    <footer class="prototype-note"><div><strong>可点击：</strong>中央 Orb、语音输入、空间桌面、旅行清单模块、权限确认、清单项目和 AI 修改。</div><div><kbd>B</kbd> 流体空间 · 深海墨 / 薄荷 / 珊瑚</div></footer>
  </main>
<script>

    folder:'<svg class="i" viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/></svg>',
    canvas:'<svg class="i" viewBox="0 0 24 24"><path d="M4 4h16v13H4zM8 21h8M12 17v4"/><path d="m7 14 3-3 2 2 3-4 2 5"/></svg>',

    spark:'<svg class="i" viewBox="0 0 24 24"><path d="m12 3 1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3ZM19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15Z"/></svg>',
    shield:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.6 2.8 8 7 10 4.2-2 7-5.4 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>',
    storage:'<svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>',
    check:'<svg class="i" viewBox="0 0 24 24"><path d="m6 12 4 4 8-9"/></svg>',
    code:'<svg class="i" viewBox="0 0 24 24"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/></svg>',
    plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'
  };
  const defs=[['01','AI 语音空间','assistant'],['02','动态空间桌面','launcher'],['03','生成与权限','build'],['04','HTML App 运行态','app']];
  const states=new WeakMap();
  function chrome(){return `<div class="status-bar"><span>9:41</span><div class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg class="wifi" viewBox="0 0 16 12"><path d="M8 11.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" fill="currentColor"/><path d="M3 7.5a7 7 0 0 1 10 0M1 4.5a11 11 0 0 1 14 0" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg><span class="battery"></span></div></div><div class="dynamic-island"></div>`}
  const bg=()=>`<div class="atmosphere"><i class="blob one"></i><i class="blob two"></i><i class="grain"></i></div>`;
  function assistant(s){return `<section class="screen">${bg()}<header class="top"><span class="brand">Daily Space</span><span class="live"><i></i>系统在线</span><button class="circle-btn" data-nav="launcher" aria-label="打开空间桌面">${I.grid}</button></header><div class="assistant-main"><article class="context-float glass"><span class="context-mark">${I.trip}</span><span class="context-copy"><strong>京都行程还缺一份清单</strong><span>我可以把它做成离线 App</span></span><span class="num">5 DAYS</span></article><div class="orb-stage"><i class="orbit"></i><i class="orbit b"></i><button class="orb" data-action="voice" aria-label="开始语音"></button></div><h2 class="idle-copy">有什么想变成现实？</h2><h2 class="listen-copy">说吧，我在听。</h2><p>${s.chat?'我会创建旅行清单，只使用自己的离线存储。':'说出一个想法，我会把它变成能直接使用的 App。'}</p><div class="quick-row"><button data-action="prompt">生成旅行清单</button><button data-nav="launcher">浏览我的空间</button></div></div><form class="float-composer glass" data-compose><input aria-label="向 Daily 输入" placeholder="描述你想要的 App…"><button type="button" class="main-action" data-action="voice">${I.mic}</button></form></section>`}
  function launcher(){return `<section class="screen">${bg()}<header class="top"><span class="brand">我的空间</span><span class="live"><i></i>1 个新 App</span><button class="circle-btn" data-nav="assistant" aria-label="回到 AI">${I.spark}</button></header><div class="launcher-inner"><div class="space-head"><h2>围绕你运行</h2><span>SPACE 01 / 02</span></div><div class="bento"><button class="tile big" data-nav="assistant"><i class="mini-orb"></i><h3>继续和 Daily 对话</h3><p>它记得刚才创建的旅行清单</p></button><button class="tile tall" data-nav="app"><span class="tile-icon coral">${I.trip}</span><h3>旅行清单</h3><p>8 项 · 离线<br>刚刚创建</p></button><button class="tile"><span class="tile-icon">${I.folder}</span><h3>文件</h3><p>1.8 GB 已使用</p></button><button class="tile"><span class="tile-icon sun">${I.canvas}</span><h3>画布</h3><p>无限工作台</p></button><button class="tile"><span class="tile-icon">${I.store}</span><h3>精选 App</h3><p>安全审核目录</p></button></div><div class="pager"><i></i><i></i></div></div><nav class="dock glass"><button class="active" data-nav="assistant">${I.spark}</button><button data-nav="app">${I.trip}</button><button>${I.folder}</button><button>${I.store}</button></nav></section>`}
  function build(){return `<section class="screen">${bg()}<div class="build-body"><div class="build-title"><button class="back" data-nav="assistant" aria-label="返回">${I.back}</button><span class="build-title-copy"><span>正在把想法变成 App</span><strong>旅行清单</strong></span><span class="version">v1.0.0</span></div><div class="build-core"><i class="core-ring"></i><i class="core-orb"></i><span class="percent">78% · 安全检查</span></div><div class="build-stream"><span class="stream-chip ok">index.html ✓</span><span class="stream-chip">manifest.json</span><span class="stream-chip">offline test</span></div><article class="build-summary glass"><div class="sum-row">${I.code}<strong>静态 HTML 包</strong><span>4 files</span></div><div class="sum-row">${I.shield}<strong>未发现高风险能力</strong><span>PASS</span></div><div class="sum-row">${I.storage}<strong>生成独立数据空间</strong><span>LOCAL</span></div></article></div><aside class="permission"><div class="handle"></div><div class="perm-head"><span class="perm-badge">${I.shield}</span><span><strong>由 Daily 系统确认权限</strong><span>App 不能伪造这一层界面</span></span></div><div class="perm-scope">${I.storage}<span><strong>仅 App 私有存储</strong><small>无法查看「文件」和其他 App 数据</small></span></div><button class="install" data-nav="app">允许、安装并打开</button><button class="deny" data-nav="assistant">暂不安装</button></aside></section>`}
  function app(s){const tasks=[['确认护照有效期','TODAY'],['预订机场巴士','JUL 31'],['下载离线地图','OFFLINE'],['整理每日穿搭','OPTIONAL']];const count=s.done.size+2,p=Math.round(count/8*100);return `<section class="screen runtime">${bg()}<header class="hostbar"><button class="back" data-nav="launcher" aria-label="返回空间">${I.back}</button><span class="host-name"><strong>旅行清单</strong><span>Sandbox · v1.0.0 · Offline</span></span><button class="modify" data-action="modify">让 Daily 修改</button></header><div class="travel"><article class="travel-hero"><span class="travel-kicker">KYOTO / FIVE DAYS</span><h2>轻装出发，<br>别忘了重要的事。</h2><p>7 月 31 日 · 京都</p><div class="ring-progress" style="--p:${p}%"><span>${count}/8</span></div></article><div class="day"><strong>出发前</strong><span>${tasks.length-s.done.size} 项待确认</span></div>${tasks.map((t,i)=>`<div class="task ${s.done.has(i)?'done':''}" data-task="${i}" role="button" tabindex="0"><span class="check">${s.done.has(i)?I.check:''}</span><span class="task-name">${t[0]}</span><span class="task-meta">${t[1]}</span></div>`).join('')}<button class="add" data-action="add">${I.plus} 添加清单项</button></div></section>`}
  function render(f){const s=states.get(f);f.classList.toggle('listening',s.listening);f.querySelector('.app-content').innerHTML=s.screen==='launcher'?launcher():s.screen==='build'?build():s.screen==='app'?app(s):assistant(s)}
  function nav(f,to){const s=states.get(f);s.screen=to;s.listening=false;render(f)}
  function toast(f,text){f.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=text;f.querySelector('.ios-screen').append(e);setTimeout(()=>e.remove(),2300)}
  function phone(initial){const f=document.createElement('div');f.className='ios-frame';f.innerHTML=`<div class="ios-screen">${chrome()}<div class="app-content"></div><div class="home-indicator"></div></div>`;states.set(f,{screen:initial,chat:initial!=='assistant',listening:false,done:new Set()});f.addEventListener('click',e=>{const s=states.get(f),n=e.target.closest('[data-nav]'),a=e.target.closest('[data-action]'),t=e.target.closest('[data-task]');if(n){nav(f,n.dataset.nav);return}if(t){const i=+t.dataset.task;s.done.has(i)?s.done.delete(i):s.done.add(i);render(f);return}if(a?.dataset.action==='voice'){s.listening=!s.listening;render(f);return}if(a?.dataset.action==='prompt'){s.chat=true;render(f);setTimeout(()=>nav(f,'build'),650);return}if(a?.dataset.action==='modify'){s.screen='assistant';s.chat=true;render(f);setTimeout(()=>toast(f,'已把「旅行清单 v1.0.0」带入对话'),20);return}if(a?.dataset.action==='add')toast(f,'原型：将展开自然语言新增输入')});f.addEventListener('submit',e=>{e.preventDefault();states.get(f).chat=true;render(f)});f.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-task]')){e.preventDefault();e.target.click()}});render(f);return f}
  const root=document.getElementById('phones');defs.forEach(([n,label,initial])=>{const u=document.createElement('article');u.className='unit';u.innerHTML=`<div class="unit-label"><strong>${label}</strong><span>${n}</span></div><div class="phone-scale"></div>`;u.querySelector('.phone-scale').append(phone(initial));root.append(u)});
</script>
</body>
</html>
