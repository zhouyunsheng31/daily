name: android

on:
  pull_request:
    paths: ['client/android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['client/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant gradlew execute permission
        run: chmod +x gradlew
        working-directory: client/android

      - name: Assemble debug + lint + detekt + unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug detekt testDebugUnitTest
        working-directory: client/android

      - uses: actions/upload-artifact@v4
        with:
          name: daily-debug-apk
          path: client/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7